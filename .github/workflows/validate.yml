name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ scripts/ tests/ tools/
      - name: Unit tests
        run: pytest tests/ --ignore=tests/test_integration_workflow_cookbook.py --durations=20

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Integration and CLI regression
        run: >-
          pytest
          tests/test_integration_workflow_cookbook.py
          tests/test_cli_unit.py
          tests/test_cli_dryrun.py
          tests/test_cli_coverage.py
          --durations=20
      - name: Contract validation
        run: |
          python scripts/quick-validate-skill.py skills/manual-bb-test-harness
          python scripts/validate-artifact.py --all examples/artifacts --strict
          python scripts/validate-spec.py --all
          python tools/ci/check_workflow_cookbook_freshness.py --repo . --strict

  coverage:
    name: Coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Overall branch coverage (85%)
        run: pytest tests/ --cov=src/bb_harness --cov=scripts --cov-branch --cov-report=xml --cov-fail-under=85 --durations=20
      - name: Gate branch coverage (90%)
        run: >-
          pytest tests/test_evaluate_gate.py tests/test_gate_v2.py
          --cov=bb_harness.gate_engine --cov-branch
          --cov-report=term-missing --cov-fail-under=90

  powershell:
    name: PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: PowerShell validation
        shell: pwsh
        run: ./scripts/validate-skill.ps1

  package-smoke:
    name: Wheel and sdist smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
      - name: Isolated wheel and sdist verification
        run: uv run python tools/ci/package_smoke.py
